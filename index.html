<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis Gastos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Onest:wght@400..700&display=swap" rel="stylesheet">

<style>
/* =========================================================
   1. TOKENS DE DISEÑO
   Todos los colores y fuentes viven aquí. Cambia un valor
   y cambia en toda la app.
   Idea de layout: una boleta. Total grande arriba, gastos
   listados por día con línea punteada hasta el monto.
   ========================================================= */
:root {
  --fondo: #f1f4ef;        /* papel con un toque verde */
  --superficie: #ffffff;   /* tarjetas */
  --tinta: #15201b;        /* texto principal */
  --tenue: #5c6a62;        /* texto secundario */
  --linea: #dbe2da;        /* bordes y separadores */
  --acento: #0b7a57;       /* verde billete: botones y foco */
  --acento-tinta: #ffffff; /* texto sobre el acento */
  --error: #b3261e;

  --fuente-titulo: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --fuente-texto: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;

  --radio: 14px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fondo: #0e1412;
    --superficie: #171f1c;
    --tinta: #e7eeea;
    --tenue: #93a39b;
    --linea: #2a3631;
    --acento: #3dc596;
    --acento-tinta: #06231a;
    --error: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fondo: #0e1412;
  --superficie: #171f1c;
  --tinta: #e7eeea;
  --tenue: #93a39b;
  --linea: #2a3631;
  --acento: #3dc596;
  --acento-tinta: #06231a;
  --error: #ff8a80;
  color-scheme: dark;
}

/* =========================================================
   2. BASE
   ========================================================= */
*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--fondo);
  color: var(--tinta);
  font-family: var(--fuente-texto);
  font-size: 16px;
  line-height: 1.45;
}

button, input { font: inherit; color: inherit; }
button { cursor: pointer; }

:focus-visible {
  outline: 2px solid var(--acento);
  outline-offset: 2px;
}

.oculto { display: none !important; }

.solo-lectores {
  position: absolute; width: 1px; height: 1px;
  overflow: hidden; clip-path: inset(50%); white-space: nowrap;
}

/* =========================================================
   3. ESTRUCTURA GENERAL
   Celular: una sola columna (total, formulario, desglose, lista).
   Pantalla ancha: dos columnas, el resumen queda fijo a la izquierda.
   ========================================================= */
.app {
  max-width: 1040px;
  margin: 0 auto;
  padding: 20px 16px 96px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.cabecera {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.marca {
  margin: 0;
  font-family: var(--fuente-titulo);
  font-weight: 800;
  font-size: 1.5rem;
  letter-spacing: -0.03em;
}
.marca span { color: var(--acento); }

.columnas { display: flex; flex-direction: column; gap: 16px; }
.columna { display: contents; }   /* en celular las columnas "desaparecen" */
.tarjeta-total    { order: 1; }
.tarjeta-form     { order: 2; }
.tarjeta-desglose { order: 3; }
.tarjeta-lista    { order: 4; }

@media (min-width: 860px) {
  .app { padding-top: 32px; }
  .columnas {
    display: grid;
    grid-template-columns: 360px minmax(0, 1fr);
    align-items: start;
    gap: 20px;
  }
  .columna { display: flex; flex-direction: column; gap: 20px; }
  .columna-resumen { position: sticky; top: 20px; }
}

.tarjeta {
  background: var(--superficie);
  border: 1px solid var(--linea);
  border-radius: var(--radio);
  padding: 20px;
}

.tarjeta h2 {
  margin: 0 0 14px;
  font-family: var(--fuente-titulo);
  font-size: 1.05rem;
  font-weight: 700;
  letter-spacing: -0.01em;
}

/* =========================================================
   4. SELECTOR DE MES
   ========================================================= */
.selector-mes {
  display: flex;
  align-items: center;
  gap: 4px;
  background: var(--superficie);
  border: 1px solid var(--linea);
  border-radius: 999px;
  padding: 4px;
}
.selector-mes button {
  width: 40px; height: 40px;
  border: 0; border-radius: 50%;
  background: transparent;
  font-size: 1.2rem; line-height: 1;
}
.selector-mes button:hover { background: var(--fondo); }
.mes-actual {
  min-width: 10.5em;
  text-align: center;
  font-weight: 600;
}
.mes-actual::first-letter { text-transform: uppercase; }

/* =========================================================
   5. TOTAL DEL MES (el número protagonista)
   ========================================================= */
.tarjeta-total {
  background: var(--tinta);
  color: var(--fondo);
  border-color: var(--tinta);
}
.total-etiqueta {
  margin: 0;
  font-size: 0.85rem;
  opacity: 0.75;
}
.total-etiqueta::first-letter { text-transform: uppercase; }
.total-monto {
  margin: 2px 0 10px;
  font-family: var(--fuente-titulo);
  font-weight: 800;
  font-size: clamp(2.6rem, 11vw, 3.6rem);
  line-height: 1;
  letter-spacing: -0.04em;
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}
.total-detalle {
  margin: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 4px 16px;
  font-size: 0.9rem;
  opacity: 0.85;
}

/* =========================================================
   6. FORMULARIO
   ========================================================= */
.form { display: flex; flex-direction: column; gap: 14px; }

.fila-doble { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 420px) { .fila-doble { grid-template-columns: 1fr; } }

.campo { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.campo label, .campo legend {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--tenue);
  padding: 0;
}
fieldset.campo { border: 0; margin: 0; padding: 0; }

.entrada {
  width: 100%;
  min-height: 46px;
  padding: 10px 12px;
  border: 1px solid var(--linea);
  border-radius: 10px;
  background: var(--fondo);
}
.entrada:focus { outline: 2px solid var(--acento); outline-offset: 0; border-color: transparent; }

.entrada-monto { position: relative; }
.entrada-monto span {
  position: absolute; left: 12px; top: 50%;
  transform: translateY(-50%);
  font-weight: 600; color: var(--tenue);
  pointer-events: none;
}
.entrada-monto .entrada {
  padding-left: 40px;
  font-family: var(--fuente-titulo);
  font-weight: 700;
  font-size: 1.15rem;
  font-variant-numeric: tabular-nums;
}

/* Categorías como pastillas (son radio buttons disfrazados) */
.pastillas { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.pastilla { position: relative; }
.pastilla input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.pastilla span {
  display: inline-flex; align-items: center; gap: 8px;
  min-height: 40px;
  padding: 6px 14px;
  border: 1px solid var(--linea);
  border-radius: 999px;
  background: var(--fondo);
  font-size: 0.92rem;
  font-weight: 500;
}
.pastilla span::before {
  content: ""; width: 10px; height: 10px; border-radius: 50%;
  background: var(--color-cat);
}
.pastilla input:checked + span {
  border-color: var(--color-cat);
  box-shadow: inset 0 0 0 1px var(--color-cat);
  background: var(--superficie);
  font-weight: 600;
}
.pastilla input:focus-visible + span { outline: 2px solid var(--acento); outline-offset: 2px; }

.mensaje-error { margin: 0; color: var(--error); font-size: 0.88rem; font-weight: 500; }

.botones { display: flex; flex-wrap: wrap; gap: 10px; }
.boton {
  min-height: 46px;
  padding: 10px 20px;
  border: 1px solid transparent;
  border-radius: 10px;
  font-weight: 600;
}
.boton-principal { background: var(--acento); color: var(--acento-tinta); flex: 1; }
.boton-principal:hover { filter: brightness(1.08); }
.boton-secundario { background: transparent; border-color: var(--linea); }
.boton-secundario:hover { background: var(--fondo); }

/* =========================================================
   7. DESGLOSE: dona + leyenda
   ========================================================= */
.dona {
  position: relative;
  width: min(220px, 70%);
  aspect-ratio: 1;
  margin: 4px auto 18px;
}
.dona canvas { width: 100% !important; height: 100% !important; }
.dona-centro {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  pointer-events: none;
  text-align: center;
}
.dona-numero {
  font-family: var(--fuente-titulo);
  font-weight: 800; font-size: 2rem; line-height: 1;
}
.dona-texto { font-size: 0.8rem; color: var(--tenue); }

.leyenda { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.leyenda li { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline; }
.leyenda-nombre { display: flex; align-items: center; gap: 8px; font-weight: 500; }
.leyenda-nombre i { width: 10px; height: 10px; border-radius: 50%; background: var(--color-cat); flex: none; }
.leyenda-monto { font-variant-numeric: tabular-nums; font-weight: 600; }
.leyenda-monto small { color: var(--tenue); font-weight: 400; margin-left: 6px; }
.leyenda-barra {
  grid-column: 1 / -1;
  height: 4px; border-radius: 2px;
  background: var(--linea);
  overflow: hidden;
}
.leyenda-barra b { display: block; height: 100%; background: var(--color-cat); border-radius: 2px; }
.leyenda li.vacia { color: var(--tenue); }

/* =========================================================
   8. LISTA DE GASTOS (estilo boleta)
   ========================================================= */
.aviso-ejemplos {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 10px;
  margin-bottom: 16px;
  padding: 12px 14px;
  border: 1px dashed var(--acento);
  border-radius: 10px;
  font-size: 0.9rem;
}
.aviso-ejemplos p { margin: 0; flex: 1 1 220px; }
.aviso-ejemplos .boton { min-height: 40px; padding: 6px 14px; }

.dia + .dia { margin-top: 18px; }
.dia-cabecera {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--linea);
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--tenue);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-variant-numeric: tabular-nums;
}
.dia ul { list-style: none; margin: 0; padding: 0; }

.gasto { padding: 12px 0 10px; }
.gasto + .gasto { border-top: 1px dashed var(--linea); }
.gasto-principal { display: flex; align-items: baseline; gap: 8px; }
.gasto-desc { font-weight: 500; overflow-wrap: anywhere; }
.gasto-lider {
  flex: 1; min-width: 16px;
  border-bottom: 2px dotted var(--linea);
  transform: translateY(-4px);
}
.gasto-monto {
  font-family: var(--fuente-titulo);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.gasto-meta {
  display: flex; flex-wrap: wrap; align-items: center; gap: 2px 12px;
  margin-top: 2px;
  font-size: 0.85rem;
  color: var(--tenue);
}
.gasto-cat { display: inline-flex; align-items: center; gap: 6px; }
.gasto-cat i { width: 8px; height: 8px; border-radius: 50%; background: var(--color-cat); }
.enlace {
  border: 0; background: none;
  padding: 6px 2px;
  color: var(--tenue);
  font-size: 0.85rem;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.enlace:hover { color: var(--tinta); }
.enlace-borrar:hover { color: var(--error); }
.gasto.editando { background: color-mix(in srgb, var(--acento) 9%, transparent); margin: 0 -10px; padding-inline: 10px; border-radius: 8px; }

.lista-vacia { margin: 0; padding: 28px 0 12px; text-align: center; color: var(--tenue); }

.nota-guardado { margin: 14px 0 0; font-size: 0.82rem; color: var(--tenue); }

/* =========================================================
   9. AVISO FLOTANTE (deshacer borrado)
   ========================================================= */
.aviso-flotante {
  position: fixed; left: 50%; bottom: 20px;
  transform: translateX(-50%);
  display: flex; align-items: center; gap: 14px;
  max-width: calc(100% - 32px);
  padding: 12px 16px;
  border-radius: 12px;
  background: var(--tinta); color: var(--fondo);
  box-shadow: 0 8px 24px rgb(0 0 0 / 0.25);
  font-size: 0.92rem;
}
.aviso-flotante button {
  border: 0; background: none;
  color: inherit; font-weight: 700;
  text-decoration: underline; text-underline-offset: 3px;
  padding: 6px 2px;
}

@media (prefers-reduced-motion: no-preference) {
  .aviso-flotante { animation: subir 0.2s ease-out; }
  @keyframes subir { from { opacity: 0; translate: 0 8px; } }
}
</style>
</head>

<body>
<div class="app">

  <header class="cabecera">
    <h1 class="marca">Mis <span>Gastos</span></h1>
    <nav class="selector-mes" aria-label="Mes que se muestra">
      <button type="button" id="mes-anterior" aria-label="Mes anterior">‹</button>
      <span class="mes-actual" id="mes-actual" aria-live="polite"></span>
      <button type="button" id="mes-siguiente" aria-label="Mes siguiente">›</button>
    </nav>
  </header>

  <main class="columnas">

    <!-- Columna izquierda: resumen del mes -->
    <div class="columna columna-resumen">
      <section class="tarjeta tarjeta-total" aria-live="polite">
        <p class="total-etiqueta" id="total-etiqueta"></p>
        <p class="total-monto" id="total-monto"></p>
        <p class="total-detalle" id="total-detalle"></p>
      </section>

      <section class="tarjeta tarjeta-desglose">
        <h2>Por categoría</h2>
        <div class="dona">
          <canvas id="grafico" role="img" aria-label="Gráfico de dona con el gasto del mes por categoría"></canvas>
          <div class="dona-centro">
            <span class="dona-numero" id="dona-numero"></span>
            <span class="dona-texto" id="dona-texto"></span>
          </div>
        </div>
        <ul class="leyenda" id="leyenda"></ul>
      </section>
    </div>

    <!-- Columna derecha: formulario y lista -->
    <div class="columna">
      <section class="tarjeta tarjeta-form" id="seccion-form">
        <h2 id="form-titulo">Nuevo gasto</h2>
        <form class="form" id="form" novalidate>
          <div class="fila-doble">
            <div class="campo">
              <label for="monto">Monto</label>
              <div class="entrada-monto">
                <span aria-hidden="true">S/</span>
                <input class="entrada" id="monto" type="number" inputmode="decimal" step="0.01" min="0.01" placeholder="0.00" autocomplete="off">
              </div>
            </div>
            <div class="campo">
              <label for="fecha">Fecha</label>
              <input class="entrada" id="fecha" type="date">
            </div>
          </div>

          <fieldset class="campo">
            <legend>Categoría</legend>
            <div class="pastillas" id="pastillas"></div>
          </fieldset>

          <div class="campo">
            <label for="descripcion">Descripción (opcional)</label>
            <input class="entrada" id="descripcion" type="text" maxlength="80" placeholder="Ej.: menú del día" autocomplete="off">
          </div>

          <p class="mensaje-error oculto" id="form-error" role="alert"></p>

          <div class="botones">
            <button class="boton boton-principal" id="boton-guardar" type="submit">Agregar gasto</button>
            <button class="boton boton-secundario oculto" id="boton-cancelar" type="button">Cancelar</button>
          </div>
        </form>
      </section>

      <section class="tarjeta tarjeta-lista">
        <h2>Gastos del mes</h2>
        <div class="aviso-ejemplos oculto" id="aviso-ejemplos">
          <p>Estos gastos son de ejemplo, para que veas cómo funciona la app.</p>
          <button class="boton boton-secundario" id="borrar-ejemplos" type="button">Borrar ejemplos</button>
        </div>
        <div id="lista"></div>
        <p class="nota-guardado" id="nota-guardado"></p>
      </section>
    </div>

  </main>
</div>

<div class="aviso-flotante oculto" id="aviso-flotante" role="status">
  <span>Gasto borrado.</span>
  <button type="button" id="deshacer">Deshacer</button>
</div>

<!-- Chart.js: la librería que dibuja la dona -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<script>
/* =========================================================
   1. CONFIGURACIÓN
   Para agregar una categoría, añade una línea aquí. El resto
   de la app (pastillas, leyenda, gráfico) se adapta sola.
   ========================================================= */
const CATEGORIAS = [
  { id: "comida",      nombre: "Comida",      color: "#e07b2e" },
  { id: "transporte",  nombre: "Transporte",  color: "#2f80d1" },
  { id: "universidad", nombre: "Universidad", color: "#7b5bc9" },
  { id: "ocio",        nombre: "Ocio",        color: "#d6467b" },
  { id: "otros",       nombre: "Otros",       color: "#74857d" },
];

const CLAVE_GUARDADO = "mis-gastos-v1";   // nombre bajo el que se guarda en localStorage

/* =========================================================
   2. ESTADO
   Toda la información de la app vive en estas variables.
   Un gasto se ve así:
   { id: "abc", monto: 12.5, categoria: "comida",
     fecha: "2026-11-10", descripcion: "Menú", ejemplo: false }
   ========================================================= */
let gastos = [];              // todos los gastos, de todos los meses
let mesVisible = "";          // mes que se muestra, formato "AAAA-MM"
let editandoId = null;        // id del gasto en edición (null = creando uno nuevo)
let ultimoBorrado = null;     // para poder deshacer un borrado
let guardadoDisponible = true;
let grafico = null;           // el objeto de Chart.js
let temporizadorAviso = null;

/* =========================================================
   3. GUARDADO (localStorage)
   localStorage solo guarda texto, por eso convertimos la
   lista a JSON al guardar y de vuelta al cargar.
   ========================================================= */
function cargarGastos() {
  try {
    const texto = localStorage.getItem(CLAVE_GUARDADO);
    if (texto === null) return null;            // primera visita
    const datos = JSON.parse(texto);
    return Array.isArray(datos) ? datos : [];
  } catch (error) {
    guardadoDisponible = false;
    return null;
  }
}

function guardarGastos() {
  try {
    localStorage.setItem(CLAVE_GUARDADO, JSON.stringify(gastos));
  } catch (error) {
    guardadoDisponible = false;
  }
}

/* =========================================================
   4. UTILIDADES (fechas, dinero, HTML)
   ========================================================= */
const $ = (id) => document.getElementById(id);

const formatoSoles = new Intl.NumberFormat("es-PE", { style: "currency", currency: "PEN" });
const soles = (monto) => formatoSoles.format(monto);

// Sumamos en céntimos (enteros) para evitar errores como 0.1 + 0.2 = 0.30000000000000004
const aCentimos = (monto) => Math.round(monto * 100);

const dosDigitos = (n) => String(n).padStart(2, "0");

function fechaDeHoy() {                       // "AAAA-MM-DD" en hora local
  const d = new Date();
  return `${d.getFullYear()}-${dosDigitos(d.getMonth() + 1)}-${dosDigitos(d.getDate())}`;
}

function aFecha(texto) {                      // "2026-11-10" -> objeto Date
  const [anio, mes, dia] = texto.split("-").map(Number);
  return new Date(anio, mes - 1, dia || 1);
}

function moverMes(mes, pasos) {               // "2026-11", +1 -> "2026-12"
  const d = aFecha(mes + "-01");
  d.setMonth(d.getMonth() + pasos);
  return `${d.getFullYear()}-${dosDigitos(d.getMonth() + 1)}`;
}

const nombreDelMes = (mes) =>
  aFecha(mes + "-01").toLocaleDateString("es-PE", { month: "long", year: "numeric" });

const nombreDelDia = (fecha) =>
  aFecha(fecha).toLocaleDateString("es-PE", { weekday: "short", day: "numeric", month: "short" });

function nuevoId() {
  return (window.crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : Date.now().toString(36) + Math.random().toString(36).slice(2);
}

const buscarCategoria = (id) => CATEGORIAS.find((c) => c.id === id) || CATEGORIAS[CATEGORIAS.length - 1];

// Crea un elemento HTML. Usar textContent evita que un texto escrito
// por el usuario se interprete como código.
function crear(etiqueta, clase, texto) {
  const elemento = document.createElement(etiqueta);
  if (clase) elemento.className = clase;
  if (texto !== undefined) elemento.textContent = texto;
  return elemento;
}

const colorDelTema = (nombre) =>
  getComputedStyle(document.documentElement).getPropertyValue(nombre).trim();

/* =========================================================
   5. CÁLCULOS
   Funciones que solo leen el estado y devuelven números.
   ========================================================= */
function gastosDelMes() {
  return gastos
    .filter((g) => g.fecha.startsWith(mesVisible))
    .sort((a, b) => b.fecha.localeCompare(a.fecha));     // más recientes primero
}

function totalesPorCategoria(lista) {          // { comida: 1250, ... } en céntimos
  const totales = {};
  CATEGORIAS.forEach((c) => { totales[c.id] = 0; });
  lista.forEach((g) => { totales[buscarCategoria(g.categoria).id] += aCentimos(g.monto); });
  return totales;
}

/* =========================================================
   6. PINTAR LA PANTALLA
   Cada vez que algo cambia llamamos a pintarTodo(), que
   vuelve a dibujar la pantalla a partir del estado.
   ========================================================= */
function pintarTodo() {
  const lista = gastosDelMes();
  const totales = totalesPorCategoria(lista);
  const total = Object.values(totales).reduce((suma, c) => suma + c, 0);

  $("mes-actual").textContent = nombreDelMes(mesVisible);
  pintarTotal(lista, totales, total);
  pintarGrafico(lista, totales, total);
  pintarLeyenda(totales, total);
  pintarLista(lista);

  $("aviso-ejemplos").classList.toggle("oculto", !gastos.some((g) => g.ejemplo));
  $("nota-guardado").textContent = guardadoDisponible
    ? "Tus gastos se guardan solo en este navegador."
    : "Este navegador no permite guardar: los gastos se perderán al cerrar la página.";
}

function pintarTotal(lista, totales, total) {
  $("total-etiqueta").textContent = "Gastado en " + nombreDelMes(mesVisible);
  $("total-monto").textContent = soles(total / 100);

  const detalle = $("total-detalle");
  detalle.replaceChildren();
  if (lista.length === 0) {
    detalle.append(crear("span", "", "Sin gastos registrados"));
    return;
  }
  const mayor = CATEGORIAS.reduce((a, b) => (totales[b.id] > totales[a.id] ? b : a));
  detalle.append(
    crear("span", "", lista.length === 1 ? "1 gasto" : lista.length + " gastos"),
    crear("span", "", "Más gasto en " + mayor.nombre.toLowerCase())
  );
}

function pintarGrafico(lista, totales, total) {
  $("dona-numero").textContent = lista.length;
  $("dona-texto").textContent = lista.length === 1 ? "gasto" : "gastos";

  if (typeof Chart === "undefined") return;   // si la librería no cargó, la leyenda igual funciona

  const conDatos = CATEGORIAS.filter((c) => totales[c.id] > 0);
  const vacio = conDatos.length === 0;

  // Con el mes vacío dibujamos un anillo gris para que no quede en blanco
  const etiquetas = vacio ? ["Sin gastos"] : conDatos.map((c) => c.nombre);
  const valores   = vacio ? [1] : conDatos.map((c) => totales[c.id] / 100);
  const colores   = vacio ? [colorDelTema("--linea")] : conDatos.map((c) => c.color);

  if (!grafico) {
    const sinAnimacion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    grafico = new Chart($("grafico"), {
      type: "doughnut",
      data: { labels: etiquetas, datasets: [{ data: valores }] },
      options: {
        cutout: "70%",
        animation: { duration: sinAnimacion ? 0 : 500 },
        plugins: {
          legend: { display: false },          // usamos nuestra propia leyenda
          tooltip: { callbacks: { label: (punto) => " " + soles(punto.parsed) } },
        },
      },
    });
  }

  const serie = grafico.data.datasets[0];
  grafico.data.labels = etiquetas;
  serie.data = valores;
  serie.backgroundColor = colores;
  serie.borderColor = colorDelTema("--superficie");
  serie.borderWidth = vacio ? 0 : 3;
  serie.hoverOffset = vacio ? 0 : 6;
  grafico.options.plugins.tooltip.enabled = !vacio;
  grafico.update();
}

function pintarLeyenda(totales, total) {
  const leyenda = $("leyenda");
  leyenda.replaceChildren();

  CATEGORIAS.forEach((c) => {
    const centimos = totales[c.id];
    const porcentaje = total > 0 ? Math.round((centimos / total) * 100) : 0;

    const fila = crear("li", centimos === 0 ? "vacia" : "");
    fila.style.setProperty("--color-cat", c.color);

    const nombre = crear("span", "leyenda-nombre");
    nombre.append(crear("i"), c.nombre);

    const monto = crear("span", "leyenda-monto", soles(centimos / 100));
    monto.append(crear("small", "", porcentaje + "%"));

    const barra = crear("span", "leyenda-barra");
    const relleno = crear("b");
    relleno.style.width = porcentaje + "%";
    barra.append(relleno);

    fila.append(nombre, monto, barra);
    leyenda.append(fila);
  });
}

function pintarLista(lista) {
  const contenedor = $("lista");
  contenedor.replaceChildren();

  if (lista.length === 0) {
    contenedor.append(crear("p", "lista-vacia", "No hay gastos en " + nombreDelMes(mesVisible) + ". Agrega el primero con el formulario."));
    return;
  }

  // Agrupamos por día: { "2026-11-10": [gasto, gasto], ... }
  const porDia = {};
  lista.forEach((g) => { (porDia[g.fecha] = porDia[g.fecha] || []).push(g); });

  Object.keys(porDia).forEach((fecha) => {
    const delDia = porDia[fecha];
    const subtotal = delDia.reduce((suma, g) => suma + aCentimos(g.monto), 0);

    const bloque = crear("section", "dia");
    const cabecera = crear("div", "dia-cabecera");
    cabecera.append(crear("span", "", nombreDelDia(fecha)), crear("span", "", soles(subtotal / 100)));

    const ul = crear("ul");
    delDia.forEach((g) => ul.append(crearFilaGasto(g)));

    bloque.append(cabecera, ul);
    contenedor.append(bloque);
  });
}

function crearFilaGasto(gasto) {
  const categoria = buscarCategoria(gasto.categoria);

  const fila = crear("li", "gasto" + (gasto.id === editandoId ? " editando" : ""));
  fila.style.setProperty("--color-cat", categoria.color);

  const principal = crear("div", "gasto-principal");
  principal.append(
    crear("span", "gasto-desc", gasto.descripcion || categoria.nombre),
    crear("span", "gasto-lider"),
    crear("span", "gasto-monto", soles(gasto.monto))
  );

  const meta = crear("div", "gasto-meta");
  const etiqueta = crear("span", "gasto-cat");
  etiqueta.append(crear("i"), categoria.nombre);

  // data-accion y data-id le dicen al manejador de clics qué hacer y con cuál gasto
  const editar = crear("button", "enlace", "Editar");
  editar.type = "button";
  editar.dataset.accion = "editar";
  editar.dataset.id = gasto.id;

  const borrar = crear("button", "enlace enlace-borrar", "Borrar");
  borrar.type = "button";
  borrar.dataset.accion = "borrar";
  borrar.dataset.id = gasto.id;

  meta.append(etiqueta, editar, borrar);
  fila.append(principal, meta);
  return fila;
}

function pintarPastillas() {                  // se ejecuta una sola vez al iniciar
  CATEGORIAS.forEach((c, i) => {
    const pastilla = crear("label", "pastilla");
    pastilla.style.setProperty("--color-cat", c.color);

    const radio = crear("input");
    radio.type = "radio";
    radio.name = "categoria";
    radio.id = "cat-" + c.id;
    radio.value = c.id;
    radio.checked = i === 0;

    pastilla.append(radio, crear("span", "", c.nombre));
    $("pastillas").append(pastilla);
  });
}

/* =========================================================
   7. ACCIONES
   Funciones que cambian el estado. Todas terminan igual:
   guardar y volver a pintar.
   ========================================================= */
function leerFormulario() {
  const monto = Math.round(parseFloat($("monto").value) * 100) / 100;
  const fecha = $("fecha").value;
  const marcada = document.querySelector('input[name="categoria"]:checked');

  if (!(monto > 0)) return { error: "Escribe un monto mayor a 0." };
  if (!/^\d{4}-\d{2}-\d{2}$/.test(fecha)) return { error: "Elige una fecha." };

  return {
    monto,
    fecha,
    categoria: marcada ? marcada.value : CATEGORIAS[0].id,
    descripcion: $("descripcion").value.trim(),
  };
}

function guardarFormulario(evento) {
  evento.preventDefault();                    // evita que la página se recargue
  const datos = leerFormulario();

  $("form-error").classList.toggle("oculto", !datos.error);
  if (datos.error) {
    $("form-error").textContent = datos.error;
    return;
  }

  if (editandoId) {
    const gasto = gastos.find((g) => g.id === editandoId);
    if (gasto) Object.assign(gasto, datos, { ejemplo: false });
  } else {
    gastos.push({ id: nuevoId(), ...datos, ejemplo: false });
  }

  mesVisible = datos.fecha.slice(0, 7);       // saltamos al mes del gasto para que se vea
  limpiarFormulario();
  guardarGastos();
  pintarTodo();
}

function empezarEdicion(id) {
  const gasto = gastos.find((g) => g.id === id);
  if (!gasto) return;

  editandoId = id;
  $("monto").value = gasto.monto;
  $("fecha").value = gasto.fecha;
  $("descripcion").value = gasto.descripcion;
  const radio = $("cat-" + buscarCategoria(gasto.categoria).id);
  if (radio) radio.checked = true;

  $("form-titulo").textContent = "Editar gasto";
  $("boton-guardar").textContent = "Guardar cambios";
  $("boton-cancelar").classList.remove("oculto");
  $("form-error").classList.add("oculto");

  pintarTodo();
  $("seccion-form").scrollIntoView({ block: "nearest", behavior: "smooth" });
  $("monto").focus({ preventScroll: true });
}

function limpiarFormulario() {
  editandoId = null;
  $("form").reset();
  $("fecha").value = fechaDeHoy();
  $("cat-" + CATEGORIAS[0].id).checked = true;
  $("form-titulo").textContent = "Nuevo gasto";
  $("boton-guardar").textContent = "Agregar gasto";
  $("boton-cancelar").classList.add("oculto");
  $("form-error").classList.add("oculto");
}

function borrarGasto(id) {
  const posicion = gastos.findIndex((g) => g.id === id);
  if (posicion === -1) return;

  ultimoBorrado = gastos.splice(posicion, 1)[0];
  if (editandoId === id) limpiarFormulario();
  guardarGastos();
  pintarTodo();

  // Mostramos "Deshacer" por 6 segundos en vez de preguntar "¿seguro?"
  $("aviso-flotante").classList.remove("oculto");
  clearTimeout(temporizadorAviso);
  temporizadorAviso = setTimeout(ocultarAviso, 6000);
}

function deshacerBorrado() {
  if (ultimoBorrado) {
    gastos.push(ultimoBorrado);
    guardarGastos();
    pintarTodo();
  }
  ocultarAviso();
}

function ocultarAviso() {
  ultimoBorrado = null;
  clearTimeout(temporizadorAviso);
  $("aviso-flotante").classList.add("oculto");
}

function borrarEjemplos() {
  gastos = gastos.filter((g) => !g.ejemplo);
  if (editandoId && !gastos.some((g) => g.id === editandoId)) limpiarFormulario();
  guardarGastos();
  pintarTodo();
}

function cambiarMes(pasos) {
  mesVisible = moverMes(mesVisible, pasos);
  pintarTodo();
}

/* =========================================================
   8. DATOS DE EJEMPLO (solo en la primera visita)
   ========================================================= */
function crearEjemplos() {
  const haceDias = (n) => {
    const d = new Date();
    d.setDate(d.getDate() - n);
    return `${d.getFullYear()}-${dosDigitos(d.getMonth() + 1)}-${dosDigitos(d.getDate())}`;
  };
  const ejemplos = [
    [0, 12.00, "comida",      "Menú del día"],
    [0,  5.00, "transporte",  "Pasajes ida y vuelta"],
    [1,  4.50, "universidad", "Copias e impresiones"],
    [1, 18.00, "comida",      "Chifa con amigos"],
    [2, 28.00, "ocio",        "Cine"],
    [3, 15.00, "universidad", "Separata de Análisis Matemático"],
    [3, 14.00, "transporte",  "Taxi a casa"],
    [4, 10.00, "otros",       "Recarga de celular"],
    [5,  9.50, "comida",      "Desayuno en la cafetería"],
  ];
  return ejemplos.map(([dias, monto, categoria, descripcion]) => ({
    id: nuevoId(), monto, categoria, descripcion, fecha: haceDias(dias), ejemplo: true,
  }));
}

/* =========================================================
   9. EVENTOS E INICIO
   Aquí conectamos los botones con las acciones de arriba.
   ========================================================= */
function iniciar() {
  const guardados = cargarGastos();
  gastos = guardados === null ? crearEjemplos() : guardados;
  mesVisible = fechaDeHoy().slice(0, 7);

  pintarPastillas();
  limpiarFormulario();
  pintarTodo();

  $("form").addEventListener("submit", guardarFormulario);
  $("boton-cancelar").addEventListener("click", () => { limpiarFormulario(); pintarTodo(); });
  $("mes-anterior").addEventListener("click", () => cambiarMes(-1));
  $("mes-siguiente").addEventListener("click", () => cambiarMes(1));
  $("borrar-ejemplos").addEventListener("click", borrarEjemplos);
  $("deshacer").addEventListener("click", deshacerBorrado);

  // Un solo manejador para todos los botones Editar/Borrar de la lista
  $("lista").addEventListener("click", (evento) => {
    const boton = evento.target.closest("button[data-accion]");
    if (!boton) return;
    if (boton.dataset.accion === "editar") empezarEdicion(boton.dataset.id);
    if (boton.dataset.accion === "borrar") borrarGasto(boton.dataset.id);
  });

  // Si cambia el tema claro/oscuro, repintamos para actualizar los colores del gráfico
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", pintarTodo);
  new MutationObserver(pintarTodo).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
}

iniciar();
</script>
